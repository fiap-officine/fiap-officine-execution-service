apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  labels:
    app: execution-service
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: execution-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: execution-service
        app.kubernetes.io/name: execution-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        # API + consumer de execution-commands + outbox relay (DynamoDB -> SQS)
        # (RUN_WORKERS=true: um único pod por réplica, ver PLANO §9.3)
        - name: app
          image: execution-service
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: execution-service-config
            - secretRef:
                name: execution-service-secrets
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-secret
                  key: license_key
                  optional: true
          readinessProbe:
            httpGet: { path: /execution/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
