apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: execution-service-config
    behavior: merge
    literals:
      - APP_ENV=homolog
      - SQS_QUEUE_PREFIX=fiap-officine-homolog
      - DYNAMODB_TABLE_PREFIX=fiap-officine-homolog

# A imagem (ECR + tag = SHA do commit) é definida pelo pipeline:
#   kustomize edit set image execution-service=<registry>/fiap-officine-execution-service:<sha>
