apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: execution-service-config
    behavior: merge
    literals:
      - APP_ENV=production
      - SQS_QUEUE_PREFIX=fiap-officine-production
      - DYNAMODB_TABLE_PREFIX=fiap-officine-production

patches:
  - target: { kind: HorizontalPodAutoscaler, name: execution-service }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target: { kind: Deployment, name: execution-service }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
